name: Nuget.org Release

on:
  release:
    types:
      - published


jobs:
    build:
      # Trusted publishing to nuget.org: shared-publish exchanges a GitHub OIDC token for a temporary API key.
      permissions:
        contents: read
        id-token: write
      uses: creatorflow-io/shared-workflows/.github/workflows/shared-publish.yml@net8
      secrets: inherit
      with:
        Target: |
          6.0.x
          8.0.x
          9.0.x
          10.0.x